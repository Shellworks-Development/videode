[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
videode-core = { path = "crates/videode-core" }
videode-media = { path = "crates/videode-media" }
# gpui-kit pins a matching GPUI snapshot and re-exports gpui, gpui-base and gpui-component.
gpui-kit = "=0.8.0"
anyhow = "1"

# Line tables only: backtraces keep file:line, but debug builds and test
# binaries stay a fraction of the size (full debuginfo filled the disk).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"
