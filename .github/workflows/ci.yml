name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan1 mesa-vulkan-drivers

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

      # Renders the main window offscreen (lavapipe on Linux, Metal on macOS).
      - name: Snapshot
        if: runner.os != 'Windows'
        continue-on-error: true
        run: cargo run -p videode-app --example snapshot -- videode-${{ runner.os }}.png 1440 900
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: snapshot-${{ runner.os }}
          path: videode-*.png
          if-no-files-found: ignore
