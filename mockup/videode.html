<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>videode — Signal Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"VArrows";src:local("Segoe UI Symbol"),local("Apple Symbols"),local("DejaVu Sans"),local("Noto Sans Symbols 2"),local("Noto Sans");unicode-range:U+2190-21FF}
:root{
  /* PLUGE steps: surfaces */
  --p0:#09090a; --p1:#111113; --p2:#19191c; --p3:#222226; --p4:#2b2b30;
  --line:#2a2a2f; --line2:#3a3a41;
  --ink:#e8e7e2; --dim:#a3a29d; --faint:#8a8984;
  --sel:#f1ede0;
  /* 75% bars: node categories only */
  --c-source:#bdbdb8; --c-transform:#c9c43c; --c-look:#3cc4c4; --c-composite:#45c45a;
  --c-audio:#c43cc4; --c-text:#d0463f; --c-output:#4a62d0;
  --warn:#e0a03a; --err:#e05a4f;
  --ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"VArrows","Geist Mono",ui-monospace,"SF Mono","Cascadia Mono",monospace;
  --s1:12px; --s2:13px;           /* the only two type sizes */
  --ease:cubic-bezier(.16,1,.3,1);
  --tlh:340px; --binw:264px; --insw:304px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--p0);color:var(--ink);font:400 var(--s1)/1.45 var(--ui);overflow:hidden;min-width:1024px;-webkit-font-smoothing:antialiased;user-select:none}
::selection{background:var(--sel);color:var(--p0)}
input,select,button,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--sel);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--p4);border:3px solid transparent;background-clip:padding-box;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--line2);background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
*{scrollbar-color:var(--p4) transparent;scrollbar-width:thin}
.mono,.tc{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
kbd{font:500 11px/16px var(--mono);color:var(--dim);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;min-width:18px;text-align:center;display:inline-block;background:var(--p1)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:38px minmax(0,1fr) 5px var(--tlh) 26px;height:100vh}
.top{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;background:var(--p1);border-bottom:1px solid var(--line);position:relative;z-index:30}
.logo{display:flex;gap:2px;margin-right:6px}.logo i{width:3px;height:15px;border-radius:1px}
.wordmark{font-weight:600;font-size:var(--s2);letter-spacing:-.01em;margin-right:8px}
.menus{display:flex}
.menu-btn{height:26px;padding:0 8px;border-radius:5px;color:var(--dim)}
.menu-btn:hover,.menu-btn[aria-expanded=true]{background:var(--p3);color:var(--ink)}
.crumbs{display:flex;align-items:center;gap:6px;margin-left:14px;color:var(--dim);white-space:nowrap}
.crumbs b{color:var(--ink);font-weight:500}
.crumbs .i{width:12px;height:12px;color:var(--faint)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.cmd{width:clamp(220px,26vw,380px);height:26px;border:1px solid var(--line2);border-radius:6px;background:var(--p0);color:var(--dim);display:flex;align-items:center;gap:8px;padding:0 4px 0 8px;text-align:left}
.cmd:hover{border-color:#4a4a52;color:var(--ink)}
.cmd span{flex:1}
.ibtn{width:28px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--dim)}
.ibtn:hover:not(:disabled){background:var(--p3);color:var(--ink)}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn[aria-pressed=true]{background:var(--p4);color:var(--ink)}
.btn{height:26px;padding:0 10px;border-radius:5px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);color:var(--ink);background:var(--p2);white-space:nowrap}
.btn:hover{background:var(--p3)}
.btn.primary{background:var(--sel);color:var(--p0);border-color:var(--sel);font-weight:500}
.btn.primary:hover{background:#fffaf0}
.btn.ghost{background:none;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{background:var(--p3);color:var(--ink)}

.mid{display:grid;grid-template-columns:var(--binw) minmax(0,1fr) var(--insw);min-height:0;position:relative}
.pane{background:var(--p1);display:flex;flex-direction:column;min-height:0;min-width:0}
.pane.bin{border-right:1px solid var(--line)}
.pane.ins{border-left:1px solid var(--line)}
.ph{height:32px;display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--line);flex:none}
.tab{height:24px;padding:0 9px;border-radius:5px;color:var(--dim);font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:var(--p3);color:var(--ink)}
.ph .sp{flex:1}
.splitter{background:var(--p0);cursor:row-resize;border-top:1px solid var(--line);position:relative}
.splitter:hover,.splitter.drag{background:var(--p3)}

/* ---------- bin ---------- */
.search{margin:8px;display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--p0);color:var(--faint)}
.search:focus-within{border-color:var(--line2);color:var(--dim)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--faint)}
.bin-body{flex:1;overflow:auto;padding:0 8px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px 8px}
.item{cursor:grab;border-radius:6px;padding:3px;outline-offset:0}
.item:hover{background:var(--p2)}
.item.sel{background:var(--p3)}
.thumb{aspect-ratio:16/9;border-radius:4px;overflow:hidden;position:relative;background:var(--p0);border:1px solid var(--line)}
.thumb img,.thumb canvas{width:100%;height:100%;display:block;object-fit:cover}
.thumb .dur{position:absolute;right:3px;bottom:3px;font:500 11px/1 var(--mono);background:rgba(9,9,10,.82);padding:2px 4px;border-radius:3px}
.thumb .scrub{position:absolute;left:0;bottom:0;height:2px;background:var(--sel);display:none}
.item:hover .thumb .scrub{display:block}
.item.offline .thumb{border:1px dashed var(--warn)}
.item.offline .thumb img{opacity:.25;filter:grayscale(1)}
.item.offline .thumb .dur{display:none}
.item.offline .thumb .off{position:absolute;inset:0;display:grid;place-items:center;color:var(--warn);font-weight:500}
.item .nm{padding:5px 2px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{padding:0 2px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bin-foot{height:26px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 10px;color:var(--faint);flex:none}
.nlib h4{font-weight:500;color:var(--dim);padding:10px 2px 4px;display:flex;align-items:center;gap:7px}
.nlib h4 i{width:8px;height:8px;border-radius:2px}
.nrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:grab}
.nrow:hover{background:var(--p2)}
.nrow .cap{width:8px;height:8px;border-radius:2px;flex:none}
.nrow b{font-weight:500;display:block}
.nrow small{color:var(--faint);font-size:var(--s1);display:block}
.nrow.na{opacity:.4}
.empty{padding:28px 12px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}

/* ---------- viewer ---------- */
.viewer{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--p0)}
.vbar{height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--dim);flex:none}
.vbar .sp{flex:1}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 16px 8px;gap:8px}
.screen{position:relative;background:#000;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.layer{position:absolute;inset:0;transform-origin:50% 50%}
.layer img{width:100%;height:100%;display:block;object-fit:cover}
.layer .tint{position:absolute;inset:0;mix-blend-mode:soft-light;pointer-events:none}
.layer.text{display:grid;place-items:center}
.layer.text span{color:#fff;letter-spacing:-.02em;white-space:nowrap;text-shadow:0 2px 18px rgba(0,0,0,.45);font-family:var(--ui)}
.screen .offline{position:absolute;inset:12%;border:1px dashed var(--warn);display:grid;place-items:center;text-align:center;color:var(--warn);background:rgba(9,9,10,.6)}
.screen .offline small{display:block;color:var(--dim);margin-top:2px;font-size:var(--s1)}
.screen .nothing{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint)}
.safe{position:absolute;inset:0;pointer-events:none;display:none}
.safe.on{display:block}
.safe i{position:absolute;border:1px solid rgba(241,237,224,.35)}
.meters{display:flex;gap:3px;align-self:stretch;padding:4px 0}
.meter{width:5px;background:var(--p2);border-radius:1px;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--c-composite) 0 70%,var(--c-transform) 70% 88%,var(--err) 88%);clip-path:inset(var(--clip,100%) 0 0 0)}
.transport{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;border-top:1px solid var(--line);background:var(--p1);flex:none}
.tc-now{font:500 var(--s2)/1 var(--mono);background:none;border:1px solid transparent;border-radius:4px;padding:4px 6px;width:118px;outline:0}
.tc-now:hover{border-color:var(--line)}
.tc-now:focus{border-color:var(--sel);background:var(--p0)}
.tbtns{display:flex;gap:2px}
.tbtns .ibtn{width:32px;height:30px}
.tbtns .play{background:var(--p3);color:var(--ink)}
.tr-r{justify-self:end;display:flex;gap:12px;align-items:center;color:var(--dim)}
.speed{color:var(--sel);font:500 var(--s1) var(--mono);min-width:28px;text-align:right}

/* ---------- inspector ---------- */
.ins-body{flex:1;overflow:auto}
.ins-head{padding:12px 12px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--p1);z-index:2}
.ins-head h2{font-size:var(--s2);font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.ins-head p{color:var(--dim);margin-top:2px}
.chainbar{display:flex;gap:1px;height:5px;margin-top:9px;border-radius:1px;overflow:hidden}
.chainbar i{flex:1}
.nsec{border-bottom:1px solid var(--line)}
.nsec.focus{background:var(--p2)}
.nsec-h{display:flex;align-items:center;gap:7px;height:34px;padding:0 6px 0 12px}
.nsec-h .chip{width:8px;height:8px;border-radius:2px;flex:none}
.nsec-h b{font-weight:600;flex:1;cursor:pointer}
.nsec-h .ibtn{width:24px;height:22px}
.nsec.bypass .nsec-h b{text-decoration:line-through;color:var(--dim)}
.nsec.bypass .rows{opacity:.45}
.rows{padding:0 12px 10px}
.prow{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;min-height:28px;gap:8px}
.prow label{color:var(--dim);cursor:ew-resize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow label:hover{color:var(--ink)}
.prow label.ro{cursor:default}
.fld{display:flex;align-items:center;height:24px;background:var(--p0);border:1px solid var(--line);border-radius:5px;padding:0 7px;gap:4px}
.fld:focus-within{border-color:var(--sel)}
.fld.changed{border-color:var(--line2)}
.fld input,.fld select{flex:1;min-width:0;background:none;border:0;outline:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.fld input.txt{font-family:var(--ui)}
.fld select{appearance:none;cursor:pointer;font-family:var(--ui)}
.fld select option{background:var(--p2)}
.fld .u{color:var(--faint);font-family:var(--mono)}
.fld.ro{background:none;color:var(--dim);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:22px}
.addnode{margin:12px;width:calc(100% - 24px);justify-content:center}
.ins-hints{padding:14px 12px;color:var(--dim);display:grid;gap:8px}
.ins-hints div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.render{padding:12px;display:grid;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--p3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sel);width:0}
.render p{color:var(--dim)}

/* ---------- timeline ---------- */
.tl{display:grid;grid-template-rows:32px minmax(0,1fr);background:var(--p1);min-height:0}
.tl-bar{display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--p0);border:1px solid var(--line);border-radius:6px;padding:1px}
.seg .ibtn{height:22px;width:28px}
.vsep{width:1px;height:16px;background:var(--line);margin:0 4px}
.tl-bar .sp{flex:1}
.zoom{width:110px;accent-color:var(--sel)}
.tl-main{display:grid;grid-template-columns:168px minmax(0,1fr);min-height:0}
.heads{border-right:1px solid var(--line);overflow:hidden;background:var(--p1);z-index:3}
.head-top{height:28px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;font:500 var(--s1) var(--mono)}
.th{display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;border-bottom:1px solid var(--line)}
.th b{font:600 var(--s1) var(--mono);width:22px}
.th .tn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.muted .tn{text-decoration:line-through;color:var(--dim)}
.th .ibtn{width:24px;height:22px}
.th .ibtn[aria-pressed=false]{color:var(--faint)}
.th .ibtn.off{color:var(--warn)}
.scroll{overflow:auto;position:relative}
.canvas{position:relative}
.ruler{position:sticky;top:0;height:28px;border-bottom:1px solid var(--line);background:var(--p1);z-index:4;cursor:text}
.ruler canvas{position:absolute;left:0;top:0;pointer-events:none}
.guide{position:absolute;top:0;height:27px;display:flex;align-items:center;font:500 var(--s1) var(--mono);color:var(--ink);background:var(--p1);padding:0 6px;pointer-events:none;z-index:2}
.guide.l{border-right:1px solid var(--line)}
.guide.r{border-left:1px solid var(--line)}
.lane{position:relative;border-bottom:1px solid var(--line)}
.lanes.snap .lane{background-image:linear-gradient(to right,rgba(255,255,255,.035) 1px,transparent 1px);background-size:var(--sec) 100%}
.clip{position:absolute;top:3px;bottom:3px;background:var(--p3);border:1px solid var(--line2);border-radius:4px;overflow:hidden;cursor:grab;display:flex;flex-direction:column}
.clip:hover{border-color:#55555e}
.clip.sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel),0 4px 14px rgba(0,0,0,.4);z-index:2}
.clip.drop{border-color:var(--sel);border-style:solid;background:var(--p4)}
.clip .nm{height:17px;padding:0 6px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;font-weight:500;flex:none;position:relative;z-index:2}
.clip .nm span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.clip .nm small{color:var(--dim);font:400 var(--s1) var(--mono);flex:none}
.clip .film{flex:1;display:flex;overflow:hidden;min-height:0;opacity:.85}
.clip .film img{height:100%;width:auto;flex:none;display:block;border-right:1px solid rgba(0,0,0,.5)}
.clip canvas.wave{flex:1;min-height:0;width:100%}
.clip .txt{flex:1;display:flex;align-items:center;padding:0 6px;color:var(--dim);white-space:nowrap;overflow:hidden}
.clip .chain{height:5px;display:flex;gap:1px;flex:none}
.clip .chain i{flex:1;min-width:2px}
.clip .chain i.byp{opacity:.25}
.clip .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:3}
.clip .h.l{left:0}.clip .h.r{right:0}
.clip .h:hover{background:rgba(241,237,224,.25)}
.clip.offline{border-style:dashed;border-color:var(--warn);background:var(--p2)}
.clip.offline .nm{color:var(--warn)}
.clip.muted{background:var(--p2)}
.clip.muted .nm span{text-decoration:line-through;color:var(--dim)}
.clip.muted .film,.clip.muted canvas.wave{opacity:.25}
.clip.locked{border-style:double;border-width:3px;cursor:not-allowed}
.clip .fade{position:absolute;top:0;bottom:5px;pointer-events:none;z-index:1}
.clip .fade.in{left:0;background:linear-gradient(to bottom right,rgba(9,9,10,.65) 50%,transparent 50.5%)}
.clip .fade.out{right:0;background:linear-gradient(to bottom left,rgba(9,9,10,.65) 50%,transparent 50.5%)}
.ph-line{position:absolute;top:0;bottom:0;width:1px;background:var(--sel);z-index:5;pointer-events:none}
.ph-line::before{content:"";position:absolute;top:0;left:-6px;width:13px;height:10px;background:var(--sel);clip-path:polygon(0 0,100% 0,100% 50%,50% 100%,0 50%)}
.snapline{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--c-transform);z-index:6;pointer-events:none;display:none}
.dragghost{position:fixed;z-index:80;pointer-events:none;padding:4px 8px;border-radius:5px;background:var(--p4);border:1px solid var(--line2);box-shadow:0 8px 20px rgba(0,0,0,.5);display:flex;align-items:center;gap:6px}
.dragghost .cap{width:8px;height:8px;border-radius:2px}
.dropbox{position:absolute;top:3px;bottom:3px;border:1px dashed var(--sel);border-radius:4px;background:rgba(241,237,224,.06);pointer-events:none;z-index:4}
.blade .clip{cursor:crosshair}
.bladeline{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--c-text);z-index:6;pointer-events:none;display:none}

/* ---------- node visuals (peek + graph) ---------- */
.node{width:136px;background:var(--p1);border:1px solid var(--line2);border-radius:6px;position:relative;cursor:pointer;flex:none}
.node:hover{border-color:#55555e}
.node.focus{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.node .cap{height:4px;border-radius:5px 5px 0 0}
.node b{display:block;font-weight:600;padding:6px 10px 0}
.node small{display:block;padding:0 10px 8px;color:var(--dim);font:400 var(--s1) var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.bypass b{text-decoration:line-through;color:var(--dim)}
.node.bypass{border-style:dashed}
.node .port{position:absolute;top:50%;width:9px;height:9px;margin-top:-2px;border-radius:50%;background:var(--p1);border:1.5px solid var(--dim)}
.node .port.in{left:-5px}.node .port.out{right:-5px}
.node.dragging{opacity:.9;box-shadow:0 10px 24px rgba(0,0,0,.6);z-index:5;cursor:grabbing}

.peek{position:fixed;z-index:40;background:var(--p2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 18px 48px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);transform-origin:0 0;display:flex;flex-direction:column;max-width:calc(100vw - 24px)}
.peek-h{height:34px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-bottom:1px solid var(--line);flex:none}
.peek-h b{font-weight:600}
.peek-h span{color:var(--dim)}
.peek-h .sp{flex:1}
.peek-body{position:relative;padding:22px 20px 22px;overflow-x:auto;overflow-y:hidden}
.peek-row{display:flex;align-items:center;gap:40px;position:relative;width:max-content}
.peek-row svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wires path{fill:none;stroke:var(--dim);stroke-width:1.5}
.wires path.byp{stroke-dasharray:3 4;opacity:.6}
.trackpin{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line2);border-radius:15px;color:var(--dim);flex:none;position:relative}
.trackpin b{color:var(--ink);font:600 var(--s1) var(--mono)}
.peek .addn{width:30px;height:30px;border:1px dashed var(--line2);border-radius:6px;display:grid;place-items:center;color:var(--dim);flex:none}
.peek .addn:hover{color:var(--ink);border-color:var(--dim)}
.peek-f{display:flex;gap:14px;padding:0 12px 10px;color:var(--faint)}
.peek-f span{display:flex;gap:5px;align-items:center}
.peek .stagger{opacity:0;transform:translateY(4px)}
.peek.open .stagger{opacity:1;transform:none;transition:opacity .22s var(--ease),transform .22s var(--ease)}

.graph{position:absolute;top:0;bottom:0;left:0;right:var(--insw);z-index:20;background:var(--p0);display:none;overflow:hidden;cursor:grab}
.graph.on{display:block}
body.graph-mode .app{grid-template-rows:38px minmax(0,1fr) 0 0 26px}
body.graph-mode .tl,body.graph-mode .splitter{visibility:hidden;overflow:hidden}
.graph.panning{cursor:grabbing}
.graph .world{position:absolute;left:0;top:0;transform-origin:0 0}
.graph .dots{position:absolute;inset:0;background-image:radial-gradient(circle,#26262b 1px,transparent 1.2px);background-size:24px 24px;pointer-events:none}
.ggroup{position:absolute;border:1px solid var(--line);border-radius:8px;background:rgba(25,25,28,.55)}
.ggroup.sel{border-color:var(--sel)}
.ggroup .gl{position:absolute;left:10px;top:4px;color:var(--dim);white-space:nowrap;display:flex;gap:8px;cursor:pointer}
.ggroup .gl b{color:var(--ink);font-weight:500}
.ggroup.offline{border-style:dashed;border-color:var(--warn)}
.graph .node{position:absolute}
.graph-hud{position:absolute;left:12px;top:10px;display:flex;gap:6px;align-items:center;z-index:2;cursor:default}
.graph-hud .note{color:var(--dim);margin-left:6px}
.pip{position:absolute;right:14px;bottom:12px;width:240px;z-index:2;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.55);border:1px solid var(--line2);cursor:default;background:var(--p1)}
.pip .screen{box-shadow:none}
.pip p{display:flex;justify-content:space-between;padding:5px 8px;color:var(--dim)}
.legend{position:absolute;left:12px;bottom:12px;z-index:2;display:flex;gap:12px;color:var(--dim);background:rgba(17,17,19,.9);padding:6px 10px;border-radius:6px;border:1px solid var(--line);cursor:default}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(5,5,6,.55);display:none}
.scrim.on{display:block}
.palette{position:fixed;left:50%;top:12vh;width:min(640px,calc(100vw - 32px));transform:translateX(-50%);background:var(--p2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 24px 64px rgba(0,0,0,.7);z-index:91;display:none;overflow:hidden}
.palette.on{display:block;animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(-6px) scale(.985)}}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 14px;height:46px;border-bottom:1px solid var(--line);color:var(--dim)}
.pal-in input{flex:1;background:none;border:0;outline:0;font-size:var(--s2);color:var(--ink)}
.pal-in input::placeholder{color:var(--faint)}
.pal-list{max-height:min(420px,56vh);overflow:auto;padding:6px}
.pal-g{padding:8px 8px 4px;color:var(--faint);font-weight:500}
.pal-it{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;cursor:pointer}
.pal-it .cap{width:8px;height:8px;border-radius:2px;background:transparent;flex:none}
.pal-it .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-it .lb mark{background:none;color:var(--sel);font-weight:600}
.pal-it .hint{color:var(--faint)}
.pal-it.act{background:var(--p4)}
.pal-it.dis{opacity:.4}
.pal-foot{display:flex;gap:16px;padding:8px 14px;border-top:1px solid var(--line);color:var(--faint)}
.pal-foot span{display:flex;gap:5px;align-items:center}
.dd{position:fixed;z-index:60;min-width:250px;background:var(--p2);border:1px solid var(--line2);border-radius:8px;box-shadow:0 16px 40px rgba(0,0,0,.6);padding:4px;display:none}
.dd.on{display:block}
.dd button{display:flex;width:100%;align-items:center;gap:10px;height:28px;padding:0 8px;border-radius:5px;text-align:left}
.dd button:hover,.dd button:focus-visible{background:var(--p4);outline:0}
.dd button:disabled{opacity:.4;cursor:default;background:none}
.dd button span{flex:1}
.dd button .cap{width:8px;height:8px;border-radius:2px;flex:none}
.dd hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.sheet{position:fixed;inset:6vh 50% auto auto;transform:translateX(50%);width:min(860px,calc(100vw - 32px));max-height:88vh;overflow:auto;background:var(--p2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 24px 64px rgba(0,0,0,.7);z-index:91;display:none;padding:18px 22px 22px}
.sheet.on{display:block;animation:pop2 .16s var(--ease)}
@keyframes pop2{from{opacity:0;transform:translateX(50%) translateY(-6px)}}
.sheet h3{font-size:var(--s2);font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.keys{columns:3 220px;column-gap:28px}
.keys section{break-inside:avoid;margin-bottom:16px}
.keys h5{font-size:var(--s1);color:var(--faint);font-weight:500;margin-bottom:4px}
.keys div{display:flex;justify-content:space-between;align-items:center;height:26px;gap:8px;border-bottom:1px solid var(--line)}
.keys div span:last-child{display:flex;gap:3px}
pre.kdl{font:400 var(--s1)/1.6 var(--mono);color:var(--ink);background:var(--p0);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow:auto;max-height:66vh;user-select:text;white-space:pre}
pre.kdl .k{color:var(--dim)}
pre.kdl .s{color:#d8d3c0}
pre.kdl .n{color:var(--c-look)}
pre.kdl .c{color:var(--faint)}
.sheet .sub{color:var(--dim);margin:-6px 0 12px}

.status{display:flex;align-items:center;gap:16px;padding:0 10px;background:var(--p1);border-top:1px solid var(--line);color:var(--dim);white-space:nowrap;overflow:hidden}
.status .msg{flex:1;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.status .msg.flash{color:var(--ink)}
.status .msg kbd{font-size:11px}
.status .st{display:flex;align-items:center;gap:6px}
.status .cache{width:56px;height:4px;background:var(--p3);border-radius:2px;overflow:hidden}
.status .cache i{display:block;height:100%;background:var(--dim)}
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--p4);color:var(--ink);border:1px solid var(--line2);border-radius:5px;padding:4px 8px;display:none;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.5);max-width:320px}
.tip.on{display:flex}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1280px){:root{--binw:224px;--insw:272px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
"use strict";
/* ================= model ================= */
const FPS = 24, SEQ_W = 1920, SEQ_H = 1080, FRAMES = 32;
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
const MOD = isMac ? "⌘" : "Ctrl";

const CATS = {
  source:{name:"Source", color:"var(--c-source)"},
  transform:{name:"Transform", color:"var(--c-transform)"},

const waveCache = {};
function peaks(id, len){ if(waveCache[id]) return waveCache[id]; let s=0; for(const ch of id) s=(s*31+ch.charCodeAt(0))>>>0; const rnd=()=>{s=(s*1664525+1013904223)>>>0; return s/4294967296;}; const a=new Float32Array(len); let env=.5; for(let i=0;i<len;i++){ if(i%Math.floor(FPS*(id==="vo"?.7:3))===0) env = id==="vo" ? (rnd()<.22?.06:.35+rnd()*.6) : .45+rnd()*.35; a[i]=clamp(env*(.55+rnd()*.45)*(id==="vo"?1:(.8+.2*Math.sin(i/9))),0,1);} return waveCache[id]=a; }
function drawWave(cv, id, from, to, color){
  const r = devicePixelRatio||1, w=cv.clientWidth||cv.width, h=cv.clientHeight||cv.height; if(!w||!h) return;

}

function activeAt(trackId, t){ return state.clips.find(c=>c.track===trackId && t>=c.start && t<cend(c)); }
function evalClip(c, t){
  const local = t - c.start;
  const r = {tx:0,ty:0,s:1,rot:0, f:[], o:1, blend:"normal", crop:null, tint:null, text:null};
  for(const n of c.nodes){ if(n.bypass) continue; const p=n.p;
    if(n.type==="Transform"){ r.tx+=p.x; r.ty+=p.y; r.s*=p.scale/100; r.rot+=p.rot; }
    if(n.type==="Crop"){ r.crop=`inset(${p.t}% ${p.r}% ${p.b}% ${p.l}%)`; }
    if(n.type==="Grade"){ r.f.push(`brightness(${Math.pow(2,p.exp).toFixed(3)})`,`saturate(${p.sat/100})`,`contrast(${p.con/100})`); const d=(p.temp-6500)/4500; r.tint = d<0 ? `rgba(255,150,60,${Math.min(.8,-d*.9)})` : `rgba(80,140,255,${Math.min(.8,d*.9)})`; }
    if(n.type==="Blur"){ r.f.push(`blur(${p.r}px)`); }
    if(n.type==="Opacity"){ r.o*=p.o/100; r.blend={Normal:"normal",Screen:"screen",Multiply:"multiply",Overlay:"overlay",Add:"plus-lighter"}[p.blend]; }
    if(n.type==="Fade"){ if(p.fi) r.o*=clamp(local/p.fi,0,1); if(p.fo) r.o*=clamp((c.dur-local)/p.fo,0,1); }
    if(n.type==="Text"){ r.text=p; }
  }
  return r;
}
function paintScreen(scr, t){
  const W = scr.clientWidth, k = W/SEQ_W;

  let any=false;
  const vt = state.tracks.filter(x=>x.kind==="video").slice().reverse();
  for(const tr of vt){
    if(!tr.on) continue;
    const c = activeAt(tr.id, t); if(!c) continue; any=true;
    if(isOffline(c)){ scr.append(el("div",{class:"offline"},`<div>${icon("link")} Media offline<small>${media(c.media).name} · relink from the Media bin</small></div>`)); continue; }
    const r = evalClip(c,t);
    const L = el("div",{class:"layer"+(r.text?" text":"")});
    L.style.transform = `translate(${r.tx*k}px,${r.ty*k}px) scale(${r.s}) rotate(${r.rot}deg)`;
    L.style.opacity = r.o; L.style.mixBlendMode = r.blend;
    if(r.text){ const s=el("span",{},r.text.text.replace(/</g,"&lt;")); s.style.fontSize=`${r.text.size*k}px`; s.style.fontWeight=r.text.weight; L.append(s); if(r.f.length) L.style.filter=r.f.join(" "); }
    else {

      if(r.f.length) img.style.filter = r.f.map(x=>x.startsWith("blur")?x.replace(/[\d.]+px/,v=>parseFloat(v)*k*2+"px"):x).join(" ");

    }

function fitScreen(){

function snapF(f, exclude, also=[]){

  for(const s of snapTargets(exclude).concat(also)){ const d=Math.abs(s-f); if(d<bd){ bd=d; best=s; } }
  if(best==null){ const g=Math.round(f/FPS)*FPS; if(Math.abs(g-f)<tol*.6) best=g; }
  return best==null? {f, hit:null} : {f:best, hit:best};
}

$("#lanes").addEventListener("pointerdown", e=>{
  const ce=e.target.closest(".clip");
  if(!ce){ select(null); scrubFromEvent(e); startScrub(e); return; }
  const c=clipById(+ce.dataset.clip), tr=track(c.track);
  if(ui.tool==="blade"){ const r=$("#tlCanvas").getBoundingClientRect(); const f=Math.round((e.clientX-r.left)/ui.ppf); if(tr.locked) return say(`${tr.id} is locked`); splitClip(c, ui.snap? snapF(f,null).f : f); return; }
  select(c.id);
  if(tr.locked){ say(`${tr.id} is locked · unlock it in the track header to edit`); return; }
  const mode = e.target.classList.contains("l") ? "trimL" : e.target.classList.contains("r") ? "trimR" : "move";
  const x0=e.clientX, y0=e.clientY, orig={start:c.start,in:c.in,dur:c.dur,track:c.track};
  const before=snapshot(); let moved=false;
  const m = c.media && media(c.media);
  const mv = ev=>{
    const df = Math.round((ev.clientX-x0)/ui.ppf);
    if(!moved && Math.abs(ev.clientX-x0)<3 && Math.abs(ev.clientY-y0)<3) return;
    moved=true;
    Object.assign(c, orig);
    let hit=null;
    if(mode==="move"){
      // vertical: change track if same kind and free
      const laneEl = document.elementsFromPoint(ev.clientX, ev.clientY).find(x=>x.classList&&x.classList.contains("lane"));
      if(laneEl){ const nt=track(laneEl.dataset.track); if(nt && nt.kind===(clipKind(c)==="audio"?"audio":"video") && !nt.locked) c.track=nt.id; }
      let s=orig.start+df;
      const a=snapF(s,c.id), b=snapF(s+c.dur,c.id);
      if(a.hit!=null && (b.hit==null || Math.abs(a.f-s)<=Math.abs(b.f-s-c.dur))){ s=a.f; hit=a.hit; } else if(b.hit!=null){ s=b.f-c.dur; hit=b.hit; }
      s=Math.max(0,s);
      if(!fits(c.track,s,c.dur,c.id)){ const {prev,next}=neighbors({...c,start:orig.start},c.track); if(c.track!==orig.track || !fits(c.track,clamp(s,prev,next-c.dur),c.dur,c.id)){ c.track=orig.track; } const nb=neighbors({...c,start:orig.start}); s=clamp(s,nb.prev,nb.next-c.dur); }
      c.start=s;
    } else if(mode==="trimL"){
      const {prev}=neighbors({...c,...orig});
      let s=orig.start+df; const sn=snapF(s,c.id); s=sn.f; hit=sn.hit;
      const minS = Math.max(prev, m? orig.start-orig.in : 0);
      s=clamp(s,minS,cend(orig)-1); c.start=s; c.dur=cend(orig)-s; if(m) c.in=orig.in+(s-orig.start);
    } else {
      const {next}=neighbors({...c,...orig});
      let e2=cend(orig)+df; const sn=snapF(e2,c.id); e2=sn.f; hit=sn.hit;
      const maxE = Math.min(next, m? orig.start + (m.dur-orig.in) : Infinity);
      e2=clamp(e2,orig.start+1,maxE); c.dur=e2-orig.start;
    }
    showSnap(hit); renderLanes(); renderRuler(); renderViewer(); if(ui.peek) positionPeek();
  };
  const up = ()=>{
    window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); showSnap(null);
    if(moved){ const changed = c.start!==orig.start||c.dur!==orig.dur||c.track!==orig.track; if(changed){ undoStack.push({s:before,label:mode==="move"?`move ${clipName(c)}`:`trim ${clipName(c)}`}); redoStack.length=0; editKey=null; say(`${mode==="move"?"Moved":"Trimmed"} <b>${clipName(c)}</b> · <span class="mono">${tc(c.start)} – ${tc(cend(c))}</span>`); } refresh(); }
  };
  window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
});

function scrubFromEvent(e){ const r=$("#tlCanvas").getBoundingClientRect(); let f=Math.round((e.clientX-r.left)/ui.ppf); if(ui.snap && e.shiftKey) f=snapF(f,null).f; seek(f); }
function startScrub(e){ const tgt=e.currentTarget; const mv=ev=>scrubFromEvent(ev); const up=()=>{ window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); }; window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up); }

/* ================= editing ops ================= */
function select(id){
  if(ui.sel===id) return;
  ui.sel=id; ui.focusNode=null; if(ui.inspect==="output" && id) ui.inspect="auto";
  if(ui.peek){ if(id) renderPeek(true); else closePeek(); }
  document.querySelectorAll(".clip").forEach(e=>e.classList.toggle("sel", +e.dataset.clip===id));
  renderInspector(); renderCrumbs(); if(ui.binTab==="nodes") renderBin(); if(ui.graph) renderGraph();
}
function splitClip(c, f){
  if(!(f>c.start && f<cend(c))) return say(`The playhead isn't inside <b>${clipName(c)}</b>`);
  commit(`split ${clipName(c)}`,()=>{
    const n=JSON.parse(JSON.stringify(c)); n.id=state.nextId++; n.start=f; n.dur=cend(c)-f; if(c.media) n.in=c.in+(f-c.start);
    c.dur=f-c.start; state.clips.push(n);
    const fa=c.nodes.find(x=>x.type==="Fade"); if(fa) fa.p.fo=0; const fb=n.nodes.find(x=>x.type==="Fade"); if(fb) fb.p.fi=0;
  });
  say(`Split <b>${clipName(c)}</b> at <span class="mono">${tc(f)}</span> · <kbd>${MOD} Z</kbd> to undo`);
}
function splitAtPlayhead(){
  const c=ui.sel&&clipById(ui.sel);
  if(c && ui.t>c.start && ui.t<cend(c)) return splitClip(c, ui.t);
  const under=state.clips.filter(x=>ui.t>x.start && ui.t<cend(x) && !track(x.track).locked);
  if(!under.length) return say("No clip under the playhead to split");
  commit(`split ${under.length} clips`,()=>{ under.forEach(c=>{ const n=JSON.parse(JSON.stringify(c)); n.id=state.nextId++; n.start=ui.t; n.dur=cend(c)-ui.t; if(c.media) n.in=c.in+(ui.t-c.start); c.dur=ui.t-c.start; state.clips.push(n); }); });
  say(`Split ${under.length} clip${under.length>1?"s":""} at <span class="mono">${tc(ui.t)}</span> · <kbd>${MOD} Z</kbd> to undo`);
}
function deleteSel(ripple){
  const c=ui.sel&&clipById(ui.sel); if(!c) return say("Select a clip to delete");
  if(track(c.track).locked) return say(`${c.track} is locked`);
  const nm=clipName(c);
  commit(`${ripple?"ripple delete":"delete"} ${nm}`,()=>{ state.clips=state.clips.filter(x=>x!==c); if(ripple) state.clips.filter(x=>x.track===c.track && x.start>=cend(c)).forEach(x=>x.start-=c.dur); });
  ui.sel=null; closePeek(true); refresh();
  say(`${ripple?"Ripple deleted":"Deleted"} <b>${nm}</b> · <kbd>${MOD} Z</kbd> to undo`);
}
function insertMedia(id, trackId, at){
  const m=media(id); const kind=m.kind;
  const tr = trackId ? track(trackId) : state.tracks.find(t=>t.kind===kind && !t.locked && fits(t.id, ui.t, Math.min(m.dur,FPS*8), null)) || state.tracks.find(t=>t.kind===kind && !t.locked);
  if(!tr) return say("No unlocked track for this media");
  let dur=Math.min(m.dur, FPS*8), start = at ?? ui.t;
  if(!fits(tr.id,start,dur,null)){ const nb=state.clips.filter(c=>c.track===tr.id && cend(c)>start).sort((a,b)=>a.start-b.start); const next=nb.find(c=>c.start>start); const free = next? next.start-start : Infinity; const cover=state.clips.find(c=>c.track===tr.id && start>=c.start && start<cend(c)); if(cover) start=cend(cover); if(!fits(tr.id,start,dur,null)){ const n2=state.clips.filter(c=>c.track===tr.id && c.start>=start).sort((a,b)=>a.start-b.start)[0]; dur = n2? Math.max(FPS, n2.start-start) : dur; if(!fits(tr.id,start,dur,null)) { start=Math.max(...state.clips.filter(c=>c.track===tr.id).map(cend)); } } }
  const c={id:state.nextId++, track:tr.id, media:id, start, in:0, dur, nodes:[mkNode("Source")]};
  commit(`insert ${m.name}`,()=>state.clips.push(c));
  select(c.id); say(`Inserted <b>${m.name}</b> on ${tr.id} at <span class="mono">${tc(start)}</span>`);
}
function addNode(clipId, type){
  const c=clipById(clipId), k=clipKind(c);
  if(!NODES[type].for.includes(k)) return say(`<b>${type}</b> works on ${NODES[type].for.join(" and ")} clips, not ${k}`);
  commit(`add ${type}`,()=>c.nodes.push(mkNode(type)));
  ui.focusNode=c.nodes.length-1; renderInspector(); if(ui.peek) renderPeek(false);
  say(`Added <b>${type}</b> to ${clipName(c)}`);
}
function addNodeToSel(type){ if(!ui.sel) return say("Select a clip first, then add a node"); addNode(ui.sel, type); }
function removeNode(clipId, idx){ const c=clipById(clipId), n=c.nodes[idx]; if(NODES[n.type].fixed) return say(`The ${n.type} node is what this clip is · delete the clip instead`); commit(`remove ${n.type}`,()=>c.nodes.splice(idx,1)); ui.focusNode=null; renderInspector(); if(ui.peek) renderPeek(false); say(`Removed <b>${n.type}</b> · <kbd>${MOD} Z</kbd> to undo`); }

/* ================= bin drag ================= */
function startBinDrag(e, payload){
  if(e.button!==0) return;
  const x0=e.clientX,y0=e.clientY; let g=null, box=null, target=null;
  const mv=ev=>{
    if(!g){ if(Math.hypot(ev.clientX-x0,ev.clientY-y0)<5) return; g=el("div",{class:"dragghost"},`<span class="cap" style="background:${payload.color}"></span>${payload.label}`); document.body.append(g); }
    g.style.left=ev.clientX+12+"px"; g.style.top=ev.clientY+10+"px";
    document.querySelectorAll(".clip.drop").forEach(x=>x.classList.remove("drop")); if(box){ box.remove(); box=null; } target=null;
    const under=document.elementsFromPoint(ev.clientX,ev.clientY);
    if(payload.node){ const ce=under.find(x=>x.classList&&x.classList.contains("clip")); if(ce){ ce.classList.add("drop"); target={clip:+ce.dataset.clip}; } return; }
    const lane=under.find(x=>x.classList&&x.classList.contains("lane"));
    if(lane){ const tr=track(lane.dataset.track), m=media(payload.media); if(tr.kind!==m.kind || tr.locked) return; const r=$("#tlCanvas").getBoundingClientRect(); let f=Math.max(0,Math.round((ev.clientX-r.left)/ui.ppf)); f=snapF(f,null).f; const dur=Math.min(m.dur,FPS*8); box=el("div",{class:"dropbox",style:`left:${f*ui.ppf}px;width:${dur*ui.ppf}px`}); lane.append(box); target={track:tr.id, at:f}; }
  };
  const up=()=>{ window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); if(g) g.remove(); if(box) box.remove(); document.querySelectorAll(".clip.drop").forEach(x=>x.classList.remove("drop"));
    if(!g){ if(payload.node) addNodeToSel(payload.node); return; }
    if(target && payload.node) addNode(target.clip, payload.node);
    else if(target && payload.media) insertMedia(payload.media, target.track, target.at); };
  window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
}

/* ================= peek ================= */
const peek=$("#peek");
function openPeek(){
  const c=ui.sel&&clipById(ui.sel);
  if(!c){ return say("Select a clip, then press <kbd>Tab</kbd> to peek at its nodes"); }
  if(ui.graph) closeGraph();
  ui.peek=true; renderPeek(true); renderCrumbs();
}
function closePeek(instant){
  if(!ui.peek) return; ui.peek=false; renderCrumbs();
  const ce=document.querySelector(`.clip[data-clip="${ui.sel}"] .chain`);
  if(instant || !ce || matchMedia("(prefers-reduced-motion: reduce)").matches){ peek.hidden=true; peek.classList.remove("open"); return; }
  const a=peek.getBoundingClientRect(), b=ce.getBoundingClientRect();
  peek.style.transition="transform .18s cubic-bezier(.4,0,1,1), opacity .18s";
  peek.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${b.width/a.width},${Math.max(.02,b.height/a.height)})`; peek.style.opacity="0";
  setTimeout(()=>{ if(!ui.peek){ peek.hidden=true; peek.classList.remove("open"); peek.style.transition=""; peek.style.transform=""; peek.style.opacity=""; } },190);
}
function renderPeek(animate){
  const c=clipById(ui.sel); if(!c) return;
  const tr=track(c.track);
  peek.innerHTML="";
  const h=el("div",{class:"peek-h"});
  h.innerHTML=`${icon("peek")}<b>${clipName(c)}</b><span>${c.nodes.length} node${c.nodes.length>1?"s":""} · drag to reorder</span><span class="sp"></span>`;
  const gb=el("button",{class:"btn ghost",style:"height:24px"},`${icon("graph")}Whole graph<kbd>⇧ Tab</kbd>`); gb.onclick=openGraph;
  const xb=el("button",{class:"ibtn","aria-label":"Close peek","data-tip":"Close","data-key":"Esc"},icon("x")); xb.onclick=()=>closePeek();
  h.append(gb,xb); peek.append(h);
  const body=el("div",{class:"peek-body"}), row=el("div",{class:"peek-row"});
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.classList.add("wires"); row.append(svg);
  c.nodes.forEach((n,i)=>{ const ne=nodeEl(n,c,i); ne.classList.add("stagger"); ne.style.transitionDelay=`${60+i*35}ms`; row.append(ne); });
  const add=el("button",{class:"addn stagger","aria-label":"Add node","data-tip":"Add node"},icon("plus")); add.style.transitionDelay=`${60+c.nodes.length*35}ms`;
  add.onclick=()=>openAddMenu(add.getBoundingClientRect(), c.id); row.append(add);
  const pin=el("div",{class:"trackpin stagger"},`<span class="port in" style="position:absolute;left:-5px;top:50%;margin-top:-4.5px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim);background:var(--p2)"></span>to&nbsp;<b>${tr.id}</b>${tr.name}`); pin.style.transitionDelay=`${90+c.nodes.length*35}ms`;
  row.append(pin); body.append(row); peek.append(body);
  peek.append(el("div",{class:"peek-f"},`<span><kbd>click</kbd> inspect node</span><span><kbd>Del</kbd> remove focused node</span><span><kbd>Esc</kbd> close</span>`));
  peek.hidden=false;
  positionPeek();
  drawPeekWires(row, svg);
  attachNodeDrag(row, svg, c);
  if(animate && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    const ce=document.querySelector(`.clip[data-clip="${c.id}"] .chain`);
    peek.classList.remove("open"); peek.style.transition="none";
    if(ce){ const a=peek.getBoundingClientRect(), b=ce.getBoundingClientRect(); peek.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${b.width/a.width},${Math.max(.02,b.height/a.height)})`; }
    peek.getBoundingClientRect();
    requestAnimationFrame(()=>{ peek.style.transition="transform .3s var(--ease)"; peek.style.transform=""; peek.classList.add("open"); });
  } else peek.classList.add("open");
}
function positionPeek(){
  const ce=document.querySelector(`.clip[data-clip="${ui.sel}"]`); if(!ce||peek.hidden) return;
  const r=ce.getBoundingClientRect(), pw=peek.offsetWidth, ph=peek.offsetHeight;
  const sr=scroll.getBoundingClientRect();
  const cx = clamp((Math.max(r.left,sr.left)+Math.min(r.right,sr.right))/2, sr.left, sr.right);
  let left=clamp(cx-pw/2, 12, innerWidth-pw-12);
  const tlTop=$("#splitter").getBoundingClientRect().bottom, floor=innerHeight-26-8;
  let top = r.bottom + 10;
  if(top+ph>floor){ top = r.top - ph - 10; if(top<tlTop+4) top = Math.max(tlTop+4, floor-ph); }
  peek.style.left=left+"px"; peek.style.top=top+"px";
}
function nodeEl(n,c,i){
  const e=el("div",{class:`node${n.bypass?" bypass":""}${ui.focusNode===i&&ui.sel===c.id?" focus":""}`, tabindex:0, role:"button", "aria-label":`${n.type} node: ${nodeSummary(n,c)}`});
  e.dataset.idx=i;
  e.innerHTML=`<div class="cap" style="background:${catColor(n.type)}"></div><b>${n.type}</b><small>${nodeSummary(n,c)||"&nbsp;"}</small>${n.type==="Source"||n.type==="Text"?"":'<span class="port in"></span>'}<span class="port out"></span>`;
  e.addEventListener("click",()=>{ if(e._dragged) return; if(ui.sel!==c.id){ select(c.id); } ui.focusNode=i; renderInspector(); document.querySelectorAll(".node").forEach(x=>x.classList.toggle("focus", x===e)); });
  e.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ e.click(); } if(ev.key==="Delete"||ev.key==="Backspace"){ ev.preventDefault(); ev.stopPropagation(); removeNode(c.id,i); } });
  return e;
}
function drawPeekWires(row, svg){
  const nodes=[...row.querySelectorAll(".node, .trackpin")]; const rr=row.getBoundingClientRect();
  svg.setAttribute("width",rr.width); svg.setAttribute("height",rr.height); svg.innerHTML="";
  const c=clipById(ui.sel);
  for(let i=0;i<nodes.length-1;i++){
    const a=nodes[i].getBoundingClientRect(), b=nodes[i+1].getBoundingClientRect();
    const x1=a.right-rr.left, y1=a.top+a.height/2-rr.top+2, x2=b.left-rr.left, y2=b.top+b.height/2-rr.top+(nodes[i+1].classList.contains("trackpin")?0:2);
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",`M${x1},${y1} C${x1+20},${y1} ${x2-20},${y2} ${x2},${y2}`);
    const bypassNext = c && c.nodes[i+1] && c.nodes[i+1].bypass; if(bypassNext) p.classList.add("byp");
    svg.append(p);
  }
}
function attachNodeDrag(row, svg, c){
  row.querySelectorAll(".node").forEach(ne=>{
    const i=+ne.dataset.idx; if(NODES[c.nodes[i].type].fixed) return;
    ne.addEventListener("pointerdown",e=>{
      const x0=e.clientX; let dx=0; ne._dragged=false; ne.setPointerCapture(e.pointerId);
      const sibs=[...row.querySelectorAll(".node")];
      const mv=ev=>{ dx=ev.clientX-x0; if(Math.abs(dx)>4){ ne._dragged=true; ne.classList.add("dragging"); ne.style.transform=`translateX(${dx}px)`; } };
      const up=ev=>{ ne.removeEventListener("pointermove",mv); ne.removeEventListener("pointerup",up);
        if(!ne._dragged) return;
        const r=ne.getBoundingClientRect(), mid=r.left+r.width/2;
        let ni=sibs.filter(s=>s!==ne).filter(s=>{ const b=s.getBoundingClientRect(); return b.left+b.width/2<mid; }).length;
        ni=Math.max(1,ni);
        if(ni!==i) commit(`reorder ${c.nodes[i].type}`,()=>{ const [n]=c.nodes.splice(i,1); c.nodes.splice(ni,0,n); });
        ui.focusNode=ni; renderPeek(false); renderInspector();
        setTimeout(()=>{ ne._dragged=false; },0);
      };
      ne.addEventListener("pointermove",mv); ne.addEventListener("pointerup",up);
    });
  });
}

/* ================= add-node menu & dropdowns ================= */
const dd=$("#dd");
function openDD(rect, items){
  dd.innerHTML="";
  items.forEach(it=>{ if(it==="-"){ dd.append(el("hr")); return; } const b=el("button",{role:"menuitem"},`${it.color?`<span class="cap" style="background:${it.color}"></span>`:""}<span>${it.label}</span>${it.key?`<kbd>${it.key}</kbd>`:""}`); if(it.disabled) b.disabled=true; b.onclick=()=>{ closeDD(); it.run(); }; dd.append(b); });
  dd.classList.add("on"); const w=dd.offsetWidth, h=dd.offsetHeight;
  dd.style.left=clamp(rect.left,8,innerWidth-w-8)+"px"; dd.style.top=(rect.bottom+4+h>innerHeight? rect.top-h-4 : rect.bottom+4)+"px";

function closeDD(){ dd.classList.remove("on"); document.querySelectorAll(".menu-btn").forEach(b=>b.setAttribute("aria-expanded","false")); }
function openAddMenu(rect, clipId){

}
dd.addEventListener("keydown",e=>{ const bs=[...dd.querySelectorAll("button:not(:disabled)")]; const i=bs.indexOf(document.activeElement); if(e.key==="ArrowDown"){ e.preventDefault(); bs[(i+1)%bs.length].focus(); } if(e.key==="ArrowUp"){ e.preventDefault(); bs[(i-1+bs.length)%bs.length].focus(); } if(e.key==="Escape"){ e.stopPropagation(); closeDD(); } });

/* ================= graph ================= */
const G={x:0,y:0,z:1, layout:null};
function openGraph(){ if(ui.peek) closePeek(true); ui.graph=true; document.body.classList.add("graph-mode"); $("#graph").classList.add("on"); renderGraph(); fitGraph(); renderCrumbs(); renderViewer(); say("Graph view · everything in the sequence is a node. <kbd>Esc</kbd> returns to the timeline"); }
function closeGraph(){ ui.graph=false; document.body.classList.remove("graph-mode"); $("#graph").classList.remove("on"); renderCrumbs(); requestAnimationFrame(()=>{ fitScreen(); renderTimeline(); renderViewer(); }); }
function renderGraph(){
  const world=$("#world"); world.innerHTML="";
  const NW=136, NH=58, CX=176, PAD=12, GH=NH+PAD*2+18;
  let y=0, maxN=Math.max(...state.clips.map(c=>c.nodes.length));
  const TX = maxN*CX + 60;
  const links=[], trackPos={}, nodes=[];
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.classList.add("wires"); svg.style.cssText="position:absolute;left:0;top:0;overflow:visible"; world.append(svg);
  state.tracks.forEach(tr=>{
    const cs=state.clips.filter(c=>c.track===tr.id).sort((a,b)=>a.start-b.start); const y0=y;
    cs.forEach(c=>{
      const gw = c.nodes.length*CX - (CX-NW) + PAD*2;
      const grp=el("div",{class:`ggroup${ui.sel===c.id?" sel":""}${isOffline(c)?" offline":""}`,style:`left:0;top:${y}px;width:${gw}px;height:${GH}px`});
      const gl=el("div",{class:"gl"},`<b>${clipName(c)}</b><span class="mono">${tc(c.start)}</span>`); grp.append(gl);
      gl.onclick=()=>select(c.id); grp.ondblclick=()=>{ closeGraph(); select(c.id); revealClip(c); openPeek(); };
      world.append(grp);
      c.nodes.forEach((n,i)=>{ const ne=nodeEl(n,c,i); ne.style.left=`${PAD+i*CX}px`; ne.style.top=`${y+PAD+18}px`; world.append(ne);
        if(i>0) links.push({x1:PAD+(i-1)*CX+NW, y1:y+PAD+18+NH/2+2, x2:PAD+i*CX, y2:y+PAD+18+NH/2+2, byp:n.bypass}); });
      const last=c.nodes.length-1; links.push({x1:PAD+last*CX+NW, y1:y+PAD+18+NH/2+2, to:tr.id});
      y+=GH+12;
    });
    if(!cs.length) y+=30;
    trackPos[tr.id]=(y0+y-12)/2; y+=18;
  });
  const mk=(name,cat,sub,x,yy)=>{ const n=el("div",{class:"node",style:`left:${x}px;top:${yy-NH/2}px`}); n.innerHTML=`<div class="cap" style="background:${CATS[cat].color}"></div><b>${name}</b><small>${sub}</small><span class="port in"></span><span class="port out"></span>`; world.append(n); return n; };
  state.tracks.forEach(tr=>{ const n=mk(`Track ${tr.id}`, tr.kind==="audio"?"audio":"composite", `${tr.name}${tr.on?"":" · off"}`, TX, trackPos[tr.id]); if(!tr.on) n.classList.add("bypass"); n.onclick=()=>{ select(null); }; });
  links.forEach(l=>{ if(l.to){ l.x2=TX; l.y2=trackPos[l.to]+2; } });
  const vT=state.tracks.filter(t=>t.kind==="video"), aT=state.tracks.filter(t=>t.kind==="audio");
  const vy=vT.reduce((a,t)=>a+trackPos[t.id],0)/vT.length, ay=aT.reduce((a,t)=>a+trackPos[t.id],0)/aT.length;
  const X2=TX+CX+40, X3=X2+CX+40, X4=X3+CX+40;
  mk("Composite","composite","stack V1 under V2",X2,vy); mk("Mix","audio","sum A1 + A2",X2,ay);
  vT.forEach(t=>links.push({x1:TX+NW,y1:trackPos[t.id]+2,x2:X2,y2:vy+2})); aT.forEach(t=>links.push({x1:TX+NW,y1:trackPos[t.id]+2,x2:X2,y2:ay+2}));
  const sy=(vy+ay)/2; const seqN=mk("Sequence","composite",`Main · ${tc(seqEnd())}`,X3,sy); seqN.onclick=()=>{ select(null); ui.inspect="auto"; renderInspector(); };
  links.push({x1:X2+NW,y1:vy+2,x2:X3,y2:sy+2},{x1:X2+NW,y1:ay+2,x2:X3,y2:sy+2});
  const outN=mk("Output","output",`${state.output.format} · ${state.output.codec}`,X4,sy); outN.onclick=()=>openOutput();
  links.push({x1:X3+NW,y1:sy+2,x2:X4,y2:sy+2});
  svg.innerHTML = links.map(l=>{ const dx=Math.max(30,(l.x2-l.x1)/2); return `<path class="${l.byp?"byp":""}" d="M${l.x1},${l.y1} C${l.x1+dx},${l.y1} ${l.x2-dx},${l.y2} ${l.x2},${l.y2}"/>`; }).join("");
  G.layout={w:X4+NW, h:y};
  applyG();
  $("#legend").innerHTML = Object.values(CATS).map(c=>`<span><i style="background:${c.color}"></i>${c.name}</span>`).join("");
}
function applyG(){ $("#world").style.transform=`translate(${G.x}px,${G.y}px) scale(${G.z})`; const d=$("#gdots"); d.style.backgroundPosition=`${G.x}px ${G.y}px`; d.style.backgroundSize=`${24*G.z}px ${24*G.z}px`; }

function stop(){ ui.playing=false; cancelAnimationFrame(raf); renderViewer(); }
function tick(now){ const dt=(now-last)/1000; last=now; acc+=dt*FPS*ui.speed; const step=Math.trunc(acc); if(step){ acc-=step; let t=ui.t+step; if(t>=seqEnd()){ t=seqEnd(); ui.t=t; stop(); renderPlayhead(); return; } if(t<=0){ t=0; ui.t=0; stop(); renderPlayhead(); return; } ui.t=t; renderPlayhead(); renderViewer(); followPlayhead(); } if(ui.playing) raf=requestAnimationFrame(tick); }

const pal=$("#palette"), palIn=$("#palIn"), palList=$("#palList"); let palItems=[], palIdx=0, recent=["split","peek","export"];
function palSource(){
  const items=A.filter(a=>a.id!=="palette").map(a=>({kind:"Actions",label:a.label,hint:a.keys[0],run:()=>runAct(a.id),dis:a.when&&!a.when(),id:a.id}));
  const c=ui.sel&&clipById(ui.sel);
  Object.keys(NODES).filter(t=>!NODES[t].fixed).forEach(t=>items.push({kind:"Add node",label:`Add ${t}${c?` to ${clipName(c)}`:""}`,hint:!c?"select a clip first":!NODES[t].for.includes(clipKind(c))?`${clipName(c)} is a ${clipKind(c)} clip`:CATS[NODES[t].cat].name,color:catColor(t),run:()=>addNodeToSel(t),dis:!c||!NODES[t].for.includes(clipKind(c))}));
  state.clips.slice().sort((a,b)=>a.start-b.start).forEach(cl=>items.push({kind:"Clips",label:`Go to ${clipName(cl)}`,hint:`${cl.track} · ${tc(cl.start)}`,run:()=>{ select(cl.id); seek(cl.start); revealClip(cl); }}));

function fuzzy(q, s){ q=q.toLowerCase(); const t=s.toLowerCase(); let i=0, score=0, last=-2, marks=[]; for(let j=0;j<t.length&&i<q.length;j++){ if(t[j]===q[i]){ score += (j===last+1?3:1) + (j===0||t[j-1]===" "?4:0); marks.push(j); last=j; i++; } } return i===q.length ? {score:score-t.length*.02, marks} : null; }
function renderPalette(){
  const q=palIn.value.trim(); let items=palSource();
  if(q){ items=items.map(it=>({...it, m:fuzzy(q,it.label)})).filter(it=>it.m).sort((a,b)=>(a.dis-b.dis)||(b.m.score-a.m.score)); }
  else { const r=recent.map(id=>items.find(x=>x.id===id)).filter(Boolean).map(x=>({...x,kind:"Recent"})); items=r.concat(items.filter(x=>x.kind==="Actions").slice(0,8)); }
  palItems=items.slice(0,60); palIdx=Math.min(palIdx,Math.max(0,palItems.length-1));
  palList.innerHTML="";
  if(!palItems.length){ palList.innerHTML=`<div class="empty"><b>Nothing matches “${q.replace(/</g,"&lt;")}”</b>Try a verb like “split”, a node like “blur”, or a clip name.</div>`; return; }
  let g=null;
  palItems.forEach((it,i)=>{
    if(it.kind!==g){ g=it.kind; palList.append(el("div",{class:"pal-g"},g)); }
    let lb=it.label; if(it.m){ lb=[...it.label].map((ch,j)=>it.m.marks.includes(j)?`<mark>${ch}</mark>`:ch).join(""); }
    const r=el("div",{class:`pal-it${i===palIdx?" act":""}${it.dis?" dis":""}`,role:"option","aria-selected":String(i===palIdx)},`<span class="cap" style="background:${it.color||"transparent"}"></span><span class="lb">${lb}</span>${it.hint?(it.kind==="Actions"||it.kind==="Recent")?`<kbd>${it.hint}</kbd>`:`<span class="hint">${it.hint}</span>`:""}`);
    r.onpointermove=()=>{ if(palIdx!==i){ palIdx=i; palList.querySelectorAll(".pal-it").forEach((x,k)=>x.classList.toggle("act",k===i)); } };
    r.onclick=()=>runPal(i); palList.append(r);
  });
  palList.querySelector(".act")?.scrollIntoView({block:"nearest"});
}
function runPal(i){ const it=palItems[i]; if(!it) return; if(it.dis){ say(it.kind==="Add node"?"Select a clip of the right kind first":"Select a clip first"); return; } closePalette(); if(it.id){ recent=[it.id,...recent.filter(x=>x!==it.id)].slice(0,3); } it.run(); }
function openPalette(prefill=""){ closeDD(); pal.classList.add("on"); $("#scrim").classList.add("on"); palIn.value=prefill; palIdx=0; renderPalette(); palIn.focus(); }
function closePalette(){ pal.classList.remove("on"); $("#scrim").classList.remove("on"); }
palIn.addEventListener("input",()=>{ palIdx=0; renderPalette(); });
palIn.addEventListener("keydown",e=>{ if(e.key==="ArrowDown"){ e.preventDefault(); palIdx=Math.min(palIdx+1,palItems.length-1); renderPalette(); } else if(e.key==="ArrowUp"){ e.preventDefault(); palIdx=Math.max(palIdx-1,0); renderPalette(); } else if(e.key==="Enter"){ e.preventDefault(); runPal(palIdx); } else if(e.key==="Escape"){ e.preventDefault(); closePalette(); } else if(e.key==="?" && !palIn.value){ e.preventDefault(); closePalette(); showKeys(); } });

function showKeys(){

  s.innerHTML=`<h3>Keyboard shortcuts<button class="ibtn" aria-label="Close">${icon("x")}</button></h3><p class="sub">Every shortcut is rebindable in Settings. Everything here is also in the command palette (${MOD} K).</p><div class="keys">${Object.entries(groups).map(([g,as])=>`<section><h5>${g}</h5>${as.map(a=>`<div><span>${a.label}</span><span>${a.keys[0].split(" ").map(k=>`<kbd>${k}</kbd>`).join("")}</span></div>`).join("")}</section>`).join("")}</div>`;

function kdlEsc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function showKDL(){
  const S=v=>`<span class="s">"${kdlEsc(v)}"</span>`, K=(k,v)=>`<span class="k">${k}=</span>${typeof v==="number"?`<span class="n">${v}</span>`:S(v)}`;

/* ================= keyboard ================= */
document.addEventListener("keydown",e=>{
  const mod=e.ctrlKey||e.metaKey, k=e.key;
  if(mod && k.toLowerCase()==="k"){ e.preventDefault(); pal.classList.contains("on")?closePalette():openPalette(); return; }
  if(pal.classList.contains("on")) return;
  if(document.querySelector(".sheet.on")){ if(k==="Escape"){ e.preventDefault(); closeSheets(); } return; }
  const tgt=e.target, typing = tgt.matches("input:not([type=range]),textarea,select");
  if(typing){ if(k==="Escape"){ tgt.blur(); } if(mod && k.toLowerCase()==="z"){ /* let field undo */ } return; }
  if(dd.classList.contains("on")) return;
  if(mod){
    const kk=k.toLowerCase();
    if(kk==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if(kk==="y"){ e.preventDefault(); redo(); return; }
    if(kk==="e"){ e.preventDefault(); openOutput(); return; }
    if(kk==="s"){ e.preventDefault(); runAct("save"); return; }
    if(kk==="i"){ e.preventDefault(); runAct("import"); return; }
    if(kk==="g"){ e.preventDefault(); runAct("goto"); return; }
    return;
  }
  const inPanel = tgt===document.body || tgt.closest(".tl,.peek,.graph,.viewer") ;
  switch(k){
    case " ": if(tgt.matches("button")&&!tgt.closest(".tbtns")) return; e.preventDefault(); runAct("togglePlay"); break;
    case "Tab": if(!inPanel) return; e.preventDefault(); runAct(e.shiftKey?"graph":"peek"); break;
    case "Escape": e.preventDefault(); if(ui.peek) closePeek(); else if(ui.graph) closeGraph(); else if(ui.inspect==="output"){ ui.inspect="auto"; renderInspector(); } else select(null); break;
    case "ArrowLeft": e.preventDefault(); runAct(e.shiftKey?"secBack":"stepBack"); break;
    case "ArrowRight": e.preventDefault(); runAct(e.shiftKey?"secFwd":"stepFwd"); break;
    case "ArrowUp": if(tgt.closest(".bin-body,.dd")) return; e.preventDefault(); runAct("prevEdit"); break;
    case "ArrowDown": if(tgt.closest(".bin-body,.dd")) return; e.preventDefault(); runAct("nextEdit"); break;
    case "Home": e.preventDefault(); runAct("toStart"); break;
    case "End": e.preventDefault(); runAct("toEnd"); break;
    case "Delete": case "Backspace": e.preventDefault(); if(ui.peek && ui.focusNode!=null && !NODES[clipById(ui.sel).nodes[ui.focusNode].type].fixed) removeNode(ui.sel, ui.focusNode); else deleteSel(e.shiftKey); break;
    case "?": e.preventDefault(); showKeys(); break;
    case "/": e.preventDefault(); runAct("filter"); break;
    case "=": case "+": runAct("zin"); break;
    case "-": case "_": runAct("zout"); break;
    case "'": toggleSafe(); break;
    default:
      switch(k.toLowerCase()){
        case "j": runAct("shuttleL"); break; case "k": runAct("shuttleS"); break; case "l": runAct("shuttleR"); break;
        case "s": runAct("split"); break; case "v": runAct("selTool"); break;
        case "b": e.shiftKey? runAct("bypass") : runAct("bladeTool"); break;
        case "n": runAct("snap"); break; case "m": runAct("mute"); break;
        case "z": if(e.shiftKey) runAct("zfit"); break;
      }
  }
});

$("#tcNow").addEventListener("blur",e=>e.target.value=tc(ui.t));
// splitter
(function(){ const sp=$("#splitter"); sp.addEventListener("pointerdown",e=>{ sp.setPointerCapture(e.pointerId); sp.classList.add("drag"); const y0=e.clientY, h0=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tlh")); const mv=ev=>{ const h=clamp(h0-(ev.clientY-y0),180,innerHeight-260); document.documentElement.style.setProperty("--tlh",h+"px"); fitScreen(); renderViewer(); renderRuler(); }; const up=()=>{ sp.classList.remove("drag"); sp.removeEventListener("pointermove",mv); sp.removeEventListener("pointerup",up); }; sp.addEventListener("pointermove",mv); sp.addEventListener("pointerup",up); }); })();

function refresh(){ renderTimeline(); renderViewer(); renderInspector(); renderStatus(); renderCrumbs(); if(ui.binTab==="nodes") renderBin(); if(ui.peek){ if(clipById(ui.sel)) renderPeek(false); else closePeek(true); } if(ui.graph) renderGraph(); if($("#kdlSheet").classList.contains("on")) showKDL(); }
new ResizeObserver(()=>{ fitScreen(); renderViewer(); renderRuler(); if(ui.peek) positionPeek(); if(ui.graph) fitGraph(); }).observe($("#stage"));
window.addEventListener("resize",()=>{ if(ui.peek) positionPeek(); });

/* boot */
(function boot(){
  const safe=el("div",{class:"safe"}); safe.innerHTML='<i style="inset:5%"></i><i style="inset:10%"></i>'; $("#screen").append(safe);
  renderBin(); fitScreen(); ui.sel=4; renderTimeline(); fitZoom(); renderViewer(); renderInspector(); renderStatus(); renderCrumbs();
  say(`Clips are made of nodes · select one and press <kbd>Tab</kbd> to peek inside, or <kbd>${MOD} K</kbd> for everything`, false);
  // preload frames
  MEDIA.filter(m=>m.kind==="video").forEach(m=>{ for(let i=1;i<=FRAMES;i++){ const im=new Image(); im.src=frameSrc(m.id,i); } });
  if(location.hash==="#peek") setTimeout(openPeek,300);
  if(location.hash==="#graph") setTimeout(openGraph,300);
  if(location.hash==="#palette") setTimeout(()=>openPalette("add"),300);
  if(location.hash==="#kdl") setTimeout(showKDL,300);
})();
</script>
</body>
</html>
